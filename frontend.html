<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CatDog Vision Classifier</title>
    <link rel="stylesheet" href="frontend.css">
</head>
<body>
    <div class="container">
        <h1>🐱🐶 CatDog Vision Classifier</h1>
        <p class="subtitle">Upload an image to classify it as Cat, Dog, or Unrelated</p>

        <!-- Upload Area -->
        <div class="upload-area" id="uploadArea">
            <div class="upload-content">
                <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <p class="upload-text">Drag & drop an image here, or click to select</p>
                <p class="upload-hint">Supported formats: JPG, PNG, WEBP (max 5MB)</p>
                <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" hidden>
            </div>
        </div>

        <!-- Image Preview -->
        <div class="preview-section" id="previewSection" style="display: none;">
            <div class="preview-container">
                <img id="imagePreview" alt="Image preview">
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-section" id="actionSection" style="display: none;">
            <button class="btn btn-primary" id="uploadBtn" disabled>Upload Image</button>
            <button class="btn btn-secondary" id="clearBtn">Clear</button>
        </div>

        <!-- Loading State -->
        <div class="loading-section" id="loadingSection" style="display: none;">
            <div class="spinner"></div>
            <p class="loading-text">Classifying image...</p>
        </div>

        <!-- Results -->
        <div class="results-section" id="resultsSection" style="display: none;">
            <h3>Classification Results</h3>
            <div class="result-card">
                <div class="result-item">
                    <span class="result-label">Prediction:</span>
                    <span class="result-value" id="prediction">-</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Confidence:</span>
                    <span class="result-value" id="confidence">-</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Details:</span>
                    <span class="result-value" id="details">-</span>
                </div>
            </div>
        </div>

        <!-- Error Message -->
        <div class="error-section" id="errorSection" style="display: none;">
            <div class="error-icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <p class="error-message" id="errorMessage">Error message will appear here</p>
        </div>
    </div>

    <script src="frontend.js"></script>
</body>
</html>
